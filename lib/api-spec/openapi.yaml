openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mkutano Convening Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: convenings
    description: Convening management
  - name: partners
    description: Partner CRM
  - name: engagements
    description: Partner engagement pipeline
  - name: speakers
    description: Speaker management
  - name: speaker-engagements
    description: Speaker engagement per convening
  - name: consents
    description: Media and publicity consent
  - name: budgets
    description: Budget tracking
  - name: workstreams
    description: Project workstreams
  - name: tasks
    description: Workstream tasks
  - name: milestones
    description: Roadmap milestones
  - name: sessions
    description: Agenda sessions
  - name: analytics
    description: Dashboard analytics
  - name: service-providers
    description: Global service provider directory
  - name: provider-bookings
    description: Per-convening provider bookings
  - name: users
    description: User management (admin)
  - name: exhibitors
    description: Exhibition exhibitor directory
  - name: booths
    description: Exhibition booth floor plan
  - name: documents
    description: Document library and outreach templates
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: sponsorship-packages
    description: Per-convening sponsorship package definitions
  - name: pass-type-configs
    description: Per-convening pass type configuration
  - name: sheets
    description: Google Sheets live sync (Admin only)
  - name: pillars
    description: Per-convening thematic pillars for partner assignment

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /audit:
    get:
      operationId: getAuditLog
      tags: [Audit]
      summary: List audit log entries (Admin only)
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            enum: [Create, Update, Delete, Restore, Export]
        - name: actorUserId
          in: query
          schema:
            type: string
        - name: conveningId
          in: query
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
            format: date-time
        - name: before
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  # ── Current user portal profile ─────────────────────────────────────────
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user's portal profile (role, convenings)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUserProfile"
        "401":
          description: Unauthenticated

  # ── Invites ──────────────────────────────────────────────────────────────
  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List all sent invites (Admin only)
      responses:
        "200":
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteRecord"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create and send an invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "200":
          description: Invite created and sent
          content:
            application/json:
              schema:
                type: object
                required: [success, inviteId]
                properties:
                  success:
                    type: boolean
                  inviteId:
                    type: string

  /invites/{id}/resend:
    post:
      operationId: resendInvite
      tags: [invites]
      summary: Resend an invite email (extends expiry)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite resent
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  # ── Convenings ───────────────────────────────────────────────────────────
  /convenings:
    get:
      operationId: listConvenings
      tags: [convenings]
      summary: List accessible convenings
      responses:
        "200":
          description: List of convenings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Convening"
    post:
      operationId: createConvening
      tags: [convenings]
      summary: Create a new convening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConveningInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convening"

  /convenings/{id}/clone:
    post:
      operationId: cloneConvening
      tags: [convenings]
      summary: Clone scaffolding from a source convening into a new one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneConveningInput"
      responses:
        "201":
          description: Newly created convening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convening"
        "404":
          description: Source not found

  /convenings/{id}:
    get:
      operationId: getConvening
      tags: [convenings]
      summary: Get a convening by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Convening detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convening"
        "404":
          description: Not found
    patch:
      operationId: updateConvening
      tags: [convenings]
      summary: Update a convening
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConveningUpdate"
      responses:
        "200":
          description: Updated convening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convening"
    delete:
      operationId: deleteConvening
      tags: [convenings]
      summary: Hard-delete an empty convening (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Convening has linked data
          content:
            application/json:
              schema:
                type: object
                required: [error, counts]
                properties:
                  error:
                    type: string
                  counts:
                    type: object
                    properties:
                      partners:   { type: integer }
                      speakers:   { type: integer }
                      delegates:  { type: integer }
                      workstreams: { type: integer }
                      sessions:   { type: integer }

  # ── Convening Team ───────────────────────────────────────────────────────
  /convenings/{id}/team:
    get:
      operationId: listConveningTeam
      tags: [convenings]
      summary: List team members for a convening with workload stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConveningTeamMember"
    post:
      operationId: addConveningTeamMember
      tags: [convenings]
      summary: Add a member to the convening team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConveningTeamMemberInput"
      responses:
        "201":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConveningTeamMember"

  /convenings/{id}/team/{userId}:
    delete:
      operationId: removeConveningTeamMember
      tags: [convenings]
      summary: Remove a member from the convening team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  # ── Pillars ───────────────────────────────────────────────────────────────
  /convenings/{id}/pillars:
    get:
      operationId: listPillars
      tags: [pillars]
      summary: List thematic pillars for a convening
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pillars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pillar"
    post:
      operationId: createPillar
      tags: [pillars]
      summary: Create a pillar for a convening
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PillarInput"
      responses:
        "201":
          description: Created pillar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pillar"
        "422":
          description: Validation error

  /convenings/{id}/pillars/{pillarId}:
    patch:
      operationId: updatePillar
      tags: [pillars]
      summary: Update a pillar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pillarId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PillarInput"
      responses:
        "200":
          description: Updated pillar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pillar"
        "404":
          description: Not found
    delete:
      operationId: deletePillar
      tags: [pillars]
      summary: Soft-delete a pillar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pillarId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Sponsorship packages ─────────────────────────────────────────────────
  /sponsorship-packages:
    get:
      operationId: listSponsorshipPackages
      tags: [sponsorship-packages]
      summary: List sponsorship packages for a convening
      parameters:
        - name: conveningId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sponsorship packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SponsorshipPackage"
    post:
      operationId: createSponsorshipPackage
      tags: [sponsorship-packages]
      summary: Create a sponsorship package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipPackageInput"
      responses:
        "201":
          description: Created package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipPackage"
  /sponsorship-packages/{id}:
    patch:
      operationId: updateSponsorshipPackage
      tags: [sponsorship-packages]
      summary: Update a sponsorship package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipPackageUpdate"
      responses:
        "200":
          description: Updated package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipPackage"
    delete:
      operationId: deleteSponsorshipPackage
      tags: [sponsorship-packages]
      summary: Delete a sponsorship package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Pass type configs ─────────────────────────────────────────────────────
  /pass-type-configs:
    get:
      operationId: listPassTypeConfigs
      tags: [pass-type-configs]
      summary: List pass type configs for a convening
      parameters:
        - name: conveningId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pass type configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PassTypeConfig"
    post:
      operationId: createPassTypeConfig
      tags: [pass-type-configs]
      summary: Create a pass type config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassTypeConfigInput"
      responses:
        "201":
          description: Created config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassTypeConfig"
  /pass-type-configs/copy-from:
    post:
      operationId: copyPassTypeConfigs
      tags: [pass-type-configs]
      summary: Copy pass type configs from one convening to another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyPassTypeConfigsInput"
      responses:
        "200":
          description: Resulting pass type configs in the target convening
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PassTypeConfig"
        "400":
          description: Missing or invalid parameters

  /pass-type-configs/{id}:
    patch:
      operationId: updatePassTypeConfig
      tags: [pass-type-configs]
      summary: Update a pass type config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassTypeConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassTypeConfig"
    delete:
      operationId: deletePassTypeConfig
      tags: [pass-type-configs]
      summary: Delete a pass type config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Partners ─────────────────────────────────────────────────────────────
  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List project-owned partner profiles
      parameters:
        - name: conveningId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of partners with engagement info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerWithEngagement"
    post:
      operationId: createPartner
      tags: [partners]
      deprecated: true
      summary: Disabled global creation; use POST /partners/link with conveningId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"

  /partners/link:
    post:
      operationId: linkPartner
      tags: [partners]
      summary: Atomically create or reuse a directory institution and link it to a convening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerLinkInput"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLinkResult"
        "409":
          description: Institution already linked or archived

  /partners/{id}/engagement:
    patch:
      operationId: updatePartnerEngagement
      tags: [partners]
      summary: Atomically update partner details and the specified convening engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerEngagementUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLinkResult"
        "404":
          description: Partner is not linked to this convening

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get a partner by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: conveningId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found
    patch:
      operationId: updatePartner
      tags: [partners]
      deprecated: true
      summary: Disabled global edit; use PATCH /partners/{id}/engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdate"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
    delete:
      operationId: deletePartner
      tags: [partners]
      deprecated: true
      summary: Disabled global delete; remove the convening engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Partner Engagements ──────────────────────────────────────────────────
  /engagements:
    get:
      operationId: listEngagements
      tags: [engagements]
      summary: List partner engagements
      parameters:
        - name: conveningId
          in: query
          required: false
          schema:
            type: string
        - name: partnerId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of engagements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engagement"
    post:
      operationId: createEngagement
      tags: [engagements]
      summary: Create a partner engagement for a convening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"

  /engagements/{id}:
    patch:
      operationId: updateEngagement
      tags: [engagements]
      summary: Update a partner engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementUpdate"
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
    delete:
      operationId: deleteEngagement
      tags: [engagements]
      summary: Delete a partner engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /engagements/{id}/stage-history:
    get:
      operationId: listEngagementStageHistory
      tags: [engagements]
      summary: List outreach stage change history for an engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stage history entries newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngagementStageHistoryEntry"
        "404":
          description: Not found

  # ── Speakers ─────────────────────────────────────────────────────────────
  /speakers:
    get:
      operationId: listSpeakers
      tags: [speakers]
      summary: List speakers linked to a convening
      parameters:
        - name: conveningId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of speakers with consent info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeakerWithConsent"
    post:
      operationId: createSpeaker
