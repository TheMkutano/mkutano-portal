      properties:
        code:
          type: string
        zone:
          type: string
        tier:
          type: string
          enum: [Premium, Standard, Startup]
        sizeSqm:
          type: number
        price:
          type: number
        status:
          type: string
          enum: [Available, Reserved, Booked]
        posX:
          type: number
        posY:
          type: number
        width:
          type: number
        height:
          type: number
        exhibitorId:
          type: string
          nullable: true

    # ── Sponsorship packages ──────────────────────────────────────────────────
    SponsorshipPackage:
      type: object
      required: [id, conveningId, tier, price, slots, perks, createdAt]
      properties:
        id:
          type: string
        conveningId:
          type: string
        tier:
          type: string
          enum: [Platinum, Gold, Silver, CredibilityOnly, InKind]
        price:
          type: number
        slots:
          type: integer
        description:
          type: [string, 'null']
        perks:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    SponsorshipPackageInput:
      type: object
      required: [conveningId, tier]
      properties:
        conveningId:
          type: string
        tier:
          type: string
          enum: [Platinum, Gold, Silver, CredibilityOnly, InKind]
        price:
          type: number
        slots:
          type: integer
        description:
          type: string
        perks:
          type: array
          items:
            type: string

    SponsorshipPackageUpdate:
      type: object
      properties:
        tier:
          type: string
          enum: [Platinum, Gold, Silver, CredibilityOnly, InKind]
        price:
          type: number
        slots:
          type: integer
        description:
          type: [string, 'null']
        perks:
          type: array
          items:
            type: string

    # ── Budget email export ────────────────────────────────────────────────────
    BudgetEmailExportInput:
      type: object
      required: [conveningId, recipients]
      properties:
        conveningId:
          type: string
        recipients:
          type: array
          items:
            type: string
            format: email
          minItems: 1
          maxItems: 20
        message:
          type: [string, 'null']
          maxLength: 2000
        currency:
          type: [string, 'null']
          description: "3-letter currency code (e.g. USD, KES)"

    # ── Budget sync ────────────────────────────────────────────────────────────
    BudgetSyncInput:
      type: object
      required: [conveningId]
      properties:
        conveningId:
          type: string

    BudgetSyncResult:
      type: object
      required: [sponsorLines, delegateLines, sponsorCompByTier]
      properties:
        sponsorLines:
          type: integer
          description: Number of sponsorship budget lines upserted
        delegateLines:
          type: integer
          description: Number of delegate revenue budget lines upserted
        sponsorCompByTier:
          type: array
          items:
            $ref: "#/components/schemas/SponsorCompTierRow"
          description: Per-tier comp-pass allocation vs issued counts (from engagements.delegatePassesAllocated)

    SponsorCompTierRow:
      type: object
      required: [tier, allocated, issued]
      properties:
        tier:
          type: string
          description: Sponsor tier label (e.g. Platinum, Gold) or "Untiered"
        allocated:
          type: integer
          description: Total delegatePassesAllocated across all engagements with this tier
        issued:
          type: integer
          description: Number of FreeSponsor delegates currently confirmed for this tier

    SponsorCompSummary:
      type: object
      required: [byTier, totalAllocated, totalIssued]
      properties:
        byTier:
          type: array
          items:
            $ref: "#/components/schemas/SponsorCompTierRow"
        totalAllocated:
          type: integer
        totalIssued:
          type: integer

    # ── Pass type configs ─────────────────────────────────────────────────────
    PassTypeConfig:
      type: object
