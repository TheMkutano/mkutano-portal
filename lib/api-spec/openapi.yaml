        conveningId:
          type: string
        passType:
          type: string
          enum: [Paid, EarlyBird, Standard, Late, FreeSponsor, FreeComp, Speaker, Press, Official, VIP]
        label:
          type: string
        price:
          type: number
        capacity:
          type: integer
        description:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    PassTypeConfigInput:
      type: object
      required: [conveningId, passType, label]
      properties:
        conveningId:
          type: string
        passType:
          type: string
          enum: [Paid, EarlyBird, Standard, Late, FreeSponsor, FreeComp, Speaker, Press, Official, VIP]
        label:
