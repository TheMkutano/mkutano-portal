        actorUserId:
          type: string
        conveningId:
          type: [string, 'null']
        before:
          type: [object, 'null']
          additionalProperties: true
        after:
          type: [object, 'null']
          additionalProperties: true

    InviteRecord:
      type: object
      required: [id, token, email, role, accountType, expiresAt, createdAt]
      properties:
        id:
          type: string
        token:
          type: string
        email:
          type: string
        role:
          type: string
        accountType:
          type: string
        conveningId:
          type: [string, 'null']
        allowedSections:
          type: [array, 'null']
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: [string, 'null']

    InviteInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        conveningId:
          type: string
        allowedSections:
          type: array
          items:
            type: string
