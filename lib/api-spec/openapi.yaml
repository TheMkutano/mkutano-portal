components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Sheets sync ─────────────────────────────────────────────────────────
    SheetsSyncInput:
      type: object
      required: [conveningId]
      properties:
        conveningId:
          type: string

    SheetsSyncResult:
      type: object
      required: [spreadsheetId, spreadsheetUrl, sheetsLastSyncedAt]
      properties:
        spreadsheetId:
          type: string
        spreadsheetUrl:
          type: string
        sheetsLastSyncedAt:
          type: string
          format: date-time

    # ── Auth ────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
